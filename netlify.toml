[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the Render backend so the browser only ever talks to
# this domain. Without this, Safari blocks the cross-domain auth cookie
# (it blocks third-party cookies by default, with no user setting to allow it).
[[redirects]]
  from = "/auth/*"
  to = "https://noyyal-app-3.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://noyyal-app-3.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
